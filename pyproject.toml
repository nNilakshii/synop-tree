[project]
name = "synop-tree"
version = "0.0.1"
description = "Hierarchical repo context for coding agents, served over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

# CLI entry points (`synop`, alias `synop-tree`) are added with the typer CLI in P1.1.1.

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]   # don't reflow code samples in docs/

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "T20",      # no print(): stdout is the MCP stdio channel
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is fine in tests
"toys/**" = ["T20"]     # P0.3 learning scripts may print

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not live"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real external APIs (LLM etc.); excluded by default, run with -m live"]
